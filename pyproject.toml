[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-to-speech-rpi"
version = "0.1.0"
description = "Fully-local speech-to-speech pipeline for Raspberry Pi (VAD, Moonshine STT, LiteRT-LM/Cactus LLM, Supertonic TTS)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "speech-to-speech RPi fork" },
]
keywords = ["speech-to-speech", "voice-agents", "speech-recognition", "text-to-speech", "openai", "raspberry-pi", "edge-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core pipeline dependencies — shared by every backend.
# All CUDA-only and macOS-only markers from the upstream manifest are stripped;
# install extras to pull model-server packages instead.
dependencies = [
    "fastapi>=0.115.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.0",
    "nltk==3.9.4",
    "numpy>=1.26.0,<2.4.4",
    "openai==2.28.0",
    "pillow>=10.0.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0",
    "scipy>=1.10.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.13.0",
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "transformers>=4.57.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
# Model-server packages. Each extra only pulls the runtime + server bits.
# The OpenAI-compat surface is implemented in this repo on top of them.
rpi-moonshine = [
    "librosa>=0.10.0",
    "soundfile>=0.13.0",
    "python-multipart>=0.0.9",
]
rpi-litertlm = [
    "litert-lm>=0.14.0",
]
rpi-supertonic = [
    "supertonic",
    "onnxruntime",
]

# Meta extras — bundle the combinations we actually recommend.
# Use one of these for the canonical RPi install.
rpi = [
    "speech-to-speech-rpi[rpi-moonshine,rpi-litertlm,rpi-supertonic]",
]

# Kept for upstream-compat tests; not used on RPi.
faster-whisper = [
    "faster-whisper",
]

[project.urls]
Homepage = "https://github.com/<your-org>/speech-to-speech-rpi"
Repository = "https://github.com/<your-org>/speech-to-speech-rpi"
Issues = "https://github.com/<your-org>/speech-to-speech-rpi/issues"

[project.scripts]
# Original realtime pipeline CLI (unchanged).
speech-to-speech = "speech_to_speech.s2s_pipeline:main"

# RPi-specific entry points.
s2s-rpi-setup = "s2s_rpi.setup:main"
moonshine-stt-server = "servers.moonshine_stt_server:main"
supertonic-tts-server = "servers.supertonic_tts_server:main"
litert-lm-mtp-server = "servers.litert_lm_mtp_server:main"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "websockets>=12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true
prerelease = "allow"

[tool.setuptools.packages.find]
where = ["src"]
include = ["speech_to_speech*", "servers*", "s2s_rpi*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
speech_to_speech = ["TTS/*.wav"]

[tool.ruff]
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = false
