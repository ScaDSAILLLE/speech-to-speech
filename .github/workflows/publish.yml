# Intentionally disabled for the RPi fork.
#
# The upstream project used this workflow to push releases to PyPI. The RPi
# fork is hosted on our own git and is not republished to PyPI — we do not
# own the `speech-to-speech` name on PyPI, and we do not want to publish a
# 1.x package there under a similar name.
#
# When this fork moves into its own git, replace this file with whatever
# CI the new home requires (lint + test + maybe an image build). The
# `ci.yml` workflow above already runs the upstream test suite; the RPi
# fork's primary CI signal is `uv run ruff check src/`.

name: Publish (disabled)

on:
  workflow_dispatch:  # manual-only; kept so the file still parses
  push:
    branches:
      - publish-disabled-keep-for-parity

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: Publish workflow is intentionally disabled in the RPi fork
        run: |
          echo "publish.yml is a no-op in the RPi fork. See MANUAL.md and AGENTS.md."
